{% set name = "sagemaker-jupyterlab-extension-common" %}
{% set version = "0.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6483e4a548c2271e4190fab5aaae2d25fc10ace7b0a4cb675adb24dab8a46465

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - jupyter_packaging >=0.12.0,<0.13.dev0
    - setuptools >=40.8.0
    - wheel
    - urllib3 <2
    - jupyterlab >=4,<4.6
    - pip
  run:
    - python >={{ python_min }}
    - boto3
    - jupyterlab >=4,<4.6
    - jupyter_events >=0.6.0
    - aiobotocore >=2.7.0
    - aws-embedded-metrics
    - y-py >=0.6.0,<0.7.0
    - ypy-websocket >=0.12.0
    - nbformat >=5.9.2
    - pydantic >=1.10.17,<3
    - pyjwt >=2.10.0,<3

test:
  imports:
    - sagemaker_jupyterlab_extension_common
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://aws.amazon.com/sagemaker/
  summary: SageMaker JupyterLab workspace common module
  license: LicenseRef-.amazon.com.-AmznSL-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - aws-brianxia
    - arkaprava08
    - joshuatowner
    - henrywa2
    - aws-jasakshi
    - aws-pavankks
    - aakashmandavilli96
    - gogakoreli
    - chaonengquan
    - zuoyuanh
    - edwardps
